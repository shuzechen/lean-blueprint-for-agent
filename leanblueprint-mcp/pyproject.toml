[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leanblueprint-mcp"
version = "0.1.0"
description = "MCP server for rendering Lean 4 blueprint dependency graphs from structured theorem data."
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "plastex>=3.1",
    "plastexdepgraph>=0.0.4",
    "leanblueprint>=0.0.20",
]

[project.scripts]
leanblueprint-mcp = "leanblueprint_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
